name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

env:
  # Define tool versions
  DART_SASS_VERSION: 1.105.1
  GO_VERSION: 1.27.2
  HUGO_VERSION: 0.168.0

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      pull-requests: write
      contents: write
      checks: write

    services:
      kroki:  
        image: yuzutech/kroki:0.32.1
        env:
          KROKI_MERMAID_HOST: mermaid   
        ports:
          - 8000:8000   
      mermaid:  
        image: yuzutech/kroki-mermaid:0.32.1

    steps:
      - uses: actions/checkout@v4

      - name: Cache Hugo resources
        uses: actions/cache@v4
        env:
          cache-name: cache-hugo-resources
        with:
          path: resources
          key: ${{ env.cache-name }}

      - uses: actions/setup-go@v4
        with:
          go-version: ${GO_VERSION}
      - run: go version

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${HUGO_VERSION}
          extended: true

      - name: Install Dart Sass
        run: |
          echo "Installing Dart Sass ${DART_SASS_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "${{ runner.temp }}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - run: npm ci && npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALICE_NOVEL }}'
          channelId: live
          projectId: alice-novel
